<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <title>REGISTER</title>
</head>

<body>

  <header>
    <nav>
      <ul class="navigation">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./login.html">Login</a></li>
        <li><a href="./register.html">Registro</a></li>
      </ul>
    </nav>

    <a href="index.html" class="logoLink">
      <img src="./img/logo.png" alt="logo" class="logo">
    </a>

    <form class="searchForm" action="./search-results.html" method="get">
      <input type="text" name="producto" placeholder="Buscar productos...">
      <button type="submit">Buscar</button>
    </form>
  </header>

  <main>

    <form action="./login.html" method="get" class="reg">
      <h2 class="h2Register">Registrate</h2>

      <div>
        <input type="email" name="mail" placeholder="Escribe tu email con @ y ." class="email">
      </div>

      <div>
        <input type="password" name="contraseña" placeholder="Escribe tu contraseña" class="password">
      </div>

      <div>
        <input type="password" name="repetirContraseña" placeholder="Escriba de nuevo su contraseña" class="password2">
      </div>

      <div class="checkTerms">
        <label class="terms">Acepto términos y condiciones</label>
        <input type="checkbox" class="checkbox" name="terminos">
      </div>

      <div>
        <button type="submit" class="registerButton">Registrarme</button>
      </div>



      <div class="account">
        <a href="./login.html">Ya tengo cuenta</a>
      </div>
    </form>

  </main>

  <footer> Juan Pablo Leoni, Santiago Straminsky, Valentino Quero</footer>
  <script src="./js/saludo.js"></script>
  <script src="./js/searchForm.js"></script>
  <script src="./js/register.js"></script>
  <script src="./js/logout.js"></script>

</body>

</html>
